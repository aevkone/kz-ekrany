<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0B0D0F">
<meta name="robots" content="noindex, nofollow">
<title>КОНТЕНТ ЗАВОД — пульт</title>
<!-- как у подарка: единственный внешний скрипт — мост Telegram; шрифты и картинки локальные (../fonts, ../img) -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23FF3B52'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="zavod.css">
</head>
<body>

<div class="bg" aria-hidden="true"><div class="grid"></div><div class="glow"></div></div>

<header class="top" id="top">
  <button class="back" id="backBtn" type="button" aria-label="Назад">
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <div class="logo"><i></i>КОНТЕНТ ЗАВОД</div>
  <div class="z-top-r" id="topR"></div>
</header>

<main id="app"></main>

<div class="cta hide" id="cta"><button class="btn block" id="ctaBtn" type="button"><span id="ctaText">Дальше</span><span class="arr">→</span></button></div>

<nav class="z-tabs" id="tabs" aria-label="Разделы завода"><div class="z-tabs-in" id="tabsIn"></div></nav>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetH">
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet-card" id="sheetCard"></div>
</div>

<div class="toast" id="toast" role="alert"></div>

<script src="api.js"></script>
<script src="mock.js"></script>
<script src="zavod.js"></script>
</body>
</html>
